<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">SANCTUARY</title>
  <desc id="d">Fly the real solar system in your browser.</desc>
  <defs>
    <radialGradient id="bg" cx="70%" cy="40%" r="80%">
      <stop offset="0" stop-color="#0d0a14"/>
      <stop offset="1" stop-color="#05040a"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.35" stop-color="#ffb24a"/>
      <stop offset="0.7" stop-color="#ff6a1f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff3b2f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="world" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#a9ffe0"/>
      <stop offset="0.45" stop-color="#47ffa9"/>
      <stop offset="1" stop-color="#0b3b2a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#47ffa9" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#47ffa9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#47ffa9" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="360"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>

    <!-- stars, each on its own slow twinkle -->
    <g fill="#ece4d0">
      <circle cx="62" cy="48" r="1.2"><animate attributeName="opacity" values="1;.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="300" r="1"><animate attributeName="opacity" values=".4;1;.4" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="232" cy="92" r="0.9"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="318" cy="330" r="1.3"><animate attributeName="opacity" values=".5;1;.5" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="402" cy="36" r="1"><animate attributeName="opacity" values="1;.4;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="486" cy="312" r="0.8"><animate attributeName="opacity" values=".3;1;.3" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="575" cy="24" r="1.1"><animate attributeName="opacity" values="1;.3;1" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="338" r="1"><animate attributeName="opacity" values=".6;1;.6" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="770" cy="58" r="0.9"><animate attributeName="opacity" values="1;.2;1" dur="5.6s" repeatCount="indefinite"/></circle>
      <circle cx="1210" cy="44" r="1.2"><animate attributeName="opacity" values=".4;1;.4" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1240" cy="318" r="1"><animate attributeName="opacity" values="1;.3;1" dur="4.9s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="330" r="0.8"><animate attributeName="opacity" values=".5;1;.5" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="36" cy="190" r="0.9"><animate attributeName="opacity" values="1;.4;1" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="300" r="0.7" fill="#74e5dc"><animate attributeName="opacity" values=".3;1;.3" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="1180" cy="196" r="0.9" fill="#ffb24a"><animate attributeName="opacity" values="1;.3;1" dur="5.1s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="210" r="0.7" fill="#cfd6e6"/>
      <circle cx="520" cy="140" r="0.6"/>
      <circle cx="840" cy="306" r="0.7"/>
      <circle cx="1010" cy="30" r="0.6"/>
      <circle cx="96" cy="120" r="0.6" fill="#ff9875"/>
    </g>

    <!-- a little solar system on the right: the Sun, two orbits and a world going round -->
    <g transform="translate(990 180)">
      <circle r="70" fill="url(#sun)"><animate attributeName="r" values="66;72;66" dur="6s" repeatCount="indefinite"/></circle>
      <ellipse rx="210" ry="62" fill="none" stroke="#f26500" stroke-opacity="0.55" stroke-width="1.2" transform="rotate(-12)"/>
      <ellipse rx="138" ry="40" fill="none" stroke="#f26500" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 5" transform="rotate(-12)"/>
      <g transform="rotate(-12)">
        <circle r="13" fill="url(#world)" filter="url(#glow)">
          <animateMotion dur="14s" repeatCount="indefinite" path="M210 0 A210 62 0 1 1 -210 0 A210 62 0 1 1 210 0"/>
        </circle>
        <circle r="4" fill="#cfd6e6">
          <animateMotion dur="7s" repeatCount="indefinite" path="M-138 0 A138 40 0 1 1 138 0 A138 40 0 1 1 -138 0"/>
        </circle>
      </g>
    </g>

    <!-- the scan: a sweep crossing the frame -->
    <rect y="0" width="180" height="360" fill="url(#sweep)">
      <animate attributeName="x" values="-200;1300" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- HUD corner ticks -->
    <g stroke="#f26500" stroke-width="1.4" fill="none" opacity="0.8">
      <path d="M24 34h14M31 27v14"/><path d="M1242 34h14M1249 27v14"/>
      <path d="M24 326h14M31 319v14"/><path d="M1242 326h14M1249 319v14"/>
    </g>

    <!-- title -->
    <text x="64" y="196" fill="#47ffa9" filter="url(#glow)" font-family="Imbue, Didot, 'Bodoni 72', 'Bodoni MT', 'Times New Roman', serif" font-size="112" font-weight="400" letter-spacing="6" textLength="560" lengthAdjust="spacingAndGlyphs">SANCTUARY</text>
    <text x="68" y="240" fill="#ff6a1f" font-family="'Share Tech Mono', Consolas, 'Courier New', monospace" font-size="18" letter-spacing="4">FLY THE REAL SOLAR SYSTEM · SCAN · SURVEY · RECORD</text>
    <text x="68" y="272" fill="#6b551f" font-family="'Share Tech Mono', Consolas, 'Courier New', monospace" font-size="14" letter-spacing="3">
      <tspan>LIVE POSITIONS · 41,486 STARS · 54 WORLDS AND VEHICLES</tspan>
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <rect x="68" y="282" width="10" height="2" fill="#47ffa9">
      <animate attributeName="width" values="10;420;10" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
